name: Assignment gate (UX only)

# Platform status is set by Simulation EG backend via GitHub webhook + API validation.
# This workflow is optional feedback for students and must not be trusted alone.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Branch format check
        shell: bash
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ ! "$BRANCH" =~ ^assignment/[1-9][0-9]*-[1-9][0-9]*$ ]]; then
            echo "::error::Branch must match assignment/{section}-{assignment} without zero-padding (e.g. assignment/1-2). Got: $BRANCH"
            exit 1
          fi
          echo "Branch format OK: $BRANCH"
      - name: Note
        run: echo "Backend validates required files from assignment flags. Fix the PR if the platform marks SubmissionInvalid."
